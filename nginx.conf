server {
    listen 8083;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Demo-Seite: von Suchmaschinen fernhalten (auch Bilder & Dateien)
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Alte .php-Links weiterleiten
    location ~ ^/(.+)\.php$ {
        return 301 /$1.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
